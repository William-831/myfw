version: "3.9"

services:
  controller:
    image: myfw/controller:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.controller
      args:
        VERSION: ${VERSION:-dev}
    container_name: myfw-controller
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/etc/myfw/config.yaml:ro
      - ./ca:/etc/myfw/ca:ro
      - ./data:/var/lib/myfw
    command: ["--config", "/etc/myfw/config.yaml"]