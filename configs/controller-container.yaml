# Controller 容器运行配置（路径为容器内绝对路径）
# CA 与数据通过 docker-compose volume 挂载
server:
  web:
    listen: ":8080"
  grpc:
    listen: ":9090"
    tls:
      ca_file: /etc/myfw/ca/ca.pem
      cert_file: /etc/myfw/ca/server.crt
      key_file: /etc/myfw/ca/server.key
      client_auth: require_and_verify

database:
  driver: sqlite
  dsn: /var/lib/myfw/dev.db
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

ca:
  key_file: /etc/myfw/ca/ca.key
  cert_file: /etc/myfw/ca/ca.pem
  agent_cert_ttl: 8760h
  agent_cert_renew_before: 720h

bootstrap:
  token_ttl: 15m

audit:
  retention_days: 365

log:
  level: info
  format: text
