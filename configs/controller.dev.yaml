# MYFW Controller — development configuration.
# Loaded by `make dev-controller`. Database is injected via env vars
# (MYFW_DB_DRIVER / MYFW_DB_DSN) which override anything set here.
# See docs/design.md § 2.3 and docs/deployment.md § 3.

server:
  web:
    listen: ":8080"
  grpc:
    listen: ":9090"
    tls:
      # Generated by `make gen-ca` into ./dev-ca (git-ignored, dev only).
      ca_file: ./dev-ca/ca.pem
      cert_file: ./dev-ca/server.crt
      key_file: ./dev-ca/server.key
      client_auth: require_and_verify

database:
  # Dev default; overridden by MYFW_DB_DRIVER / MYFW_DB_DSN env vars.
  driver: sqlite
  dsn: ./dev.db
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

ca:
  key_file: ./dev-ca/ca.key
  cert_file: ./dev-ca/ca.pem
  agent_cert_ttl: 8760h          # 1 year
  agent_cert_renew_before: 720h  # 30 days

bootstrap:
  token_ttl: 15m

audit:
  retention_days: 365

log:
  level: debug
  format: text
