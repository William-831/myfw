syntax = "proto3";

package myfw.v1;

option go_package = "iptables-tool/api/myfw/v1;myfwv1";

import "myfw/v1/common.proto";
import "myfw/v1/rule.proto";

// AgentStream is the single long-lived, mTLS-authenticated, bidirectional
// channel an ACTIVE Agent holds open to the Controller. The Agent dials the
// Controller (never the reverse) and multiplexes heartbeats, task dispatch,
// results, and state pushes over this stream. See design.md § 13.
service AgentStream {
  rpc Connect(stream AgentToController) returns (stream ControllerToAgent);
}

// ---- Agent -> Controller ----

message AgentToController {
  oneof payload {
    Heartbeat heartbeat = 1;
    TaskResult task_result = 2;
    DriftReport drift = 3;
    StateReport state = 4;
    SyncRequest sync = 5;
    IptablesRules iptables_rules = 6;
  }
}

message Heartbeat {
  string node_id = 1;
  int64 ts_unix = 2;
  string current_hash = 3;       // hash of the live MYFW namespace
  Capability capability = 4;     // resent on change
}

message TaskResult {
  string task_id = 1;
  bool ok = 2;
  string message = 3;
  string result_hash = 4;        // MYFW hash after applying
  int64 ts_unix = 5;
}

// DriftReport is emitted by the Watchdog when the live MYFW namespace no
// longer matches the expected hash (see design.md § 12).
message DriftReport {
  string node_id = 1;
  string expected_hash = 2;
  string actual_hash = 3;
  string detail = 4;
  int64 ts_unix = 5;
}

// StateReport carries periodic network telemetry (see design.md § 14).
message StateReport {
  string node_id = 1;
  int64 ts_unix = 2;
  repeated InterfaceStat interfaces = 3;
  uint64 conntrack_count = 4;
}

// IptablesRules 报告节点当前的 iptables 规则
message IptablesRules {
  string node_id = 1;
  int64 ts_unix = 2;
  repeated IptablesChain chains = 3;
}

message IptablesChain {
  string table = 1;      // filter, nat, mangle, raw
  string chain = 2;      // INPUT, OUTPUT, FORWARD, etc.
  repeated string rules = 3;  // iptables -S 输出的规则行
}

message InterfaceStat {
  string name = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_packets = 4;
  uint64 tx_packets = 5;
}

message AgentStats {
  float cpu_percent = 1;
  int64 mem_usage_bytes = 2;
  int64 mem_total_bytes = 3;
  int64 connection_count = 4;
  repeated NetworkStats network_stats = 5;
  repeated RuleHit rule_hits = 6;
  Timestamp timestamp = 7;
}

message NetworkStats {
  string interface = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_packets = 4;
  int64 tx_packets = 5;
}

message RuleHit {
  string rule_id = 1;
  int64 hits = 2;
}

// ---- Controller -> Agent ----

message ControllerToAgent {
  oneof payload {
    ApplyTask apply = 1;
    ConfirmTask confirm = 2;
    RollbackTask rollback = 3;
    SyncRequest sync = 4;
    HeartbeatAck ack = 5;
    SyncRulesRequest sync_rules = 6;
    RuleOperation rule_operation = 7;
    ExecCommand exec_command = 8;   // 专家模式:裸 iptables 命令
  }
}

// SyncRulesRequest 请求 Agent 上报当前 iptables 规则
message SyncRulesRequest {
  string reason = 1;
}

// RuleOpType 单条规则操作类型。
enum RuleOpType {
  RULE_OP_UNSPECIFIED = 0;
  RULE_OP_ADD = 1;       // 追加到链尾 (iptables -A)
  RULE_OP_INSERT = 2;    // 插入到指定位置 (iptables -I)
  RULE_OP_DELETE = 3;    // 删除 (iptables -D)
  RULE_OP_REPLACE = 4;   // 替换 (iptables -R)
}

// RuleOperation 下发单条规则操作到 Agent（节点规则页增删改插）。
// 双模式：
//   - 专家模式：rule_line 给出 iptables-save 格式规则体（如 "-p tcp --dport 80 -j ACCEPT"）
//   - 结构化模式：rule_line 为空时，由 action/protocol/source/destination/port 翻译
message RuleOperation {
  string task_id = 1;
  string table = 2;          // filter/nat/mangle/raw
  string chain = 3;          // INPUT/OUTPUT/FORWARD/...
  RuleOpType op = 4;
  int32 position = 5;        // 插入/替换位置（1-based），0 表示追加
  string rule_line = 6;      // 专家模式：原始规则体
  string action = 7;         // ACCEPT/DROP/REJECT/MARK/DNAT/SNAT
  string protocol = 8;       // tcp/udp/icmp/any
  string source = 9;         // 源 IP/CIDR
  string destination = 10;   // 目的 IP/CIDR
  string port = 11;          // 端口或范围
}

// ExecCommand 专家模式:下发裸 iptables 命令到 Agent 执行。
// command 为完整命令(如 "iptables -t nat -L -n"、"iptables-save -t filter"),
// Agent 侧校验首 token 必须属于 iptables 族白名单,执行后回 TaskResult。
// 注意:此通道绕过 MYFW 命名空间/快照/保护期,仅供高级管理员排障,强审计留痕。
message ExecCommand {
  string task_id = 1;
  string command = 2;   // 完整裸命令(iptables 族)
}

// ApplyTask instructs the Agent to snapshot, then converge its MYFW namespace
// to the given RuleSet, then wait for a ConfirmTask within confirm_deadline
// (else auto-rollback). See design.md § 11.
message ApplyTask {
  string task_id = 1;
  RuleSet rule_set = 2;
  int64 confirm_deadline_unix = 3;
}

message ConfirmTask {
  string task_id = 1;
}

message RollbackTask {
  string task_id = 1;
}

// SyncRequest asks the Agent to report its full current MYFW state so the
// Controller can reconcile after a reconnect.
message SyncRequest {
  string reason = 1;
}

message HeartbeatAck {
  int64 ts_unix = 1;
}
