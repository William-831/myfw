version: "3"
services:
  controller:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.compose
    image: myfw-controller:v0.2.0
    container_name: myfw-controller
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      # DSN 走 env(见 config.go),指定挂载路径以持久化,避免容器重建丢库
      - MYFW_DB_DRIVER=sqlite
      - MYFW_DB_DSN=/var/lib/myfw/dev.db
    volumes:
      # CA 证书只读挂载（含 ca.key 供 Controller 签发 Agent 证书）
      - ./dev-ca:/etc/myfw/ca:ro
      # 数据目录（SQLite dev.db 持久化）
      - ./data:/var/lib/myfw
      # 容器内绝对路径配置
      - ./configs/controller-container.yaml:/etc/myfw/config.yaml:ro
      # 前端静态资源（web/dist -> /var/www/myfw）
      - ./web/dist:/var/www/myfw:ro
      # Controller 二进制:host go build 后挂载覆盖,绕过 docker build 拉基础镜像(arm64 镜像问题)
      - ./dist/myfw-controller:/usr/local/bin/myfw-controller:ro
    restart: unless-stopped
