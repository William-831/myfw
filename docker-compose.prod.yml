version: "3"
services:
  controller:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: myfw-controller:v1.2
    container_name: myfw-controller
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file:
      - .env  # 敏感配置(DB DSN / HMAC 密钥)从 .env 加载,不入镜像
    volumes:
      - ./deploy/docker/configs/controller.prod.example.yaml:/etc/myfw/config.yaml:ro  # 生产配置
      - ./data:/data  # SQLite 数据
    restart: unless-stopped
